<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con esquinas redondeadas -->
  <rect width="1000" height="300" rx="12" fill="url(#bg)" />
  
  <!-- Línea decorativa superior -->
  <rect x="0" y="0" width="1000" height="6" fill="url(#accent)" />
  
  <!-- Texto principal -->
  <text x="50" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="bold" fill="#f8fafc">
    Game Development Portfolio
  </text>
  
  <!-- Subtítulo -->
  <text x="50" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#38bdf8">
    Ing. Americo Oswaldo Ramirez Rocha
  </text>
  
  <!-- Descripción corta -->
  <text x="50" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    Prototipos funcionales, experiencias interactivas y desarrollo de mecánicas lúdicas.
  </text>
  
  <!-- Etiquetas de tecnologías simuladas -->
  <g transform="translate(50, 235)">
    <rect x="0" y="0" width="90" height="28" rx="6" fill="#334155" />
    <text x="45" y="18" font-family="monospace" font-size="12" fill="#f8fafc" text-anchor="middle">HTML5</text>
    
    <rect x="100" y="0" width="90" height="28" rx="6" fill="#334155" />
    <text x="145" y="18" font-family="monospace" font-size="12" fill="#f8fafc" text-anchor="middle">CSS3</text>
    
    <rect x="200" y="0" width="110" height="28" rx="6" fill="#334155" />
    <text x="255" y="18" font-family="monospace" font-size="12" fill="#f8fafc" text-anchor="middle">JavaScript</text>
    
    <rect x="320" y="0" width="100" height="28" rx="6" fill="#334155" />
    <text x="370" y="18" font-family="monospace" font-size="12" fill="#f8fafc" text-anchor="middle">Canvas 2D</text>
  </g>
</svg>
